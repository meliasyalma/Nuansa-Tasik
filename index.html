<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuansa Tasikmalaya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { forest:'#123B35', emeraldNature:'#27866C', mintSoft:'#E9F4EF', amberWarm:'#F4B860', creamLight:'#FAF8F5' }, fontFamily: { heading:['Poppins','sans-serif'], sans:['Inter','sans-serif'] } } } };</script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/syalma_style.css">
</head>
<body class="antialiased flex flex-col min-h-screen" data-page="home">

<!-- PERBAIKAN: Navbar pakai bg-forest agar teks putih kelihatan -->
<header id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-forest text-white py-4 shadow-lg transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5">
            <div class="w-12 h-12 rounded-xl bg-white/10 flex items-center justify-center">
                <i data-lucide="compass" class="w-7 h-7 text-amberWarm"></i>
            </div>
            <span class="font-heading font-bold text-xl tracking-tight block leading-none">Nuansa <span class="text-amberWarm">Tasikmalaya</span></span>
        </a>
        
        <!-- Menu Desktop -->
        <nav class="hidden lg:flex items-center gap-1 xl:gap-2">
            <a href="index.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Home</a>
            <a href="wisata.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Destinasi</a>
            <a href="peta.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Peta</a>
            <a href="trip-planner.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Planner</a>
            <a href="kuliner.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Kuliner</a>
            <a href="artikel.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Artikel</a>
            <a href="kontak.html" class="px-3.5 py-2 rounded-xl text-sm font-medium hover:bg-white/15">Kontak</a>
        </nav>
        
        <div class="flex items-center gap-2.5">
            <button onclick="toggleFavoritesModal()" class="relative p-2.5 rounded-xl bg-white/15 hover:bg-white/25 flex items-center gap-1.5">
                <i data-lucide="heart" class="w-5 h-5 text-amberWarm fill-amberWarm"></i>
                <span class="hidden sm:inline text-xs font-semibold">Favorit</span>
                <span id="fav-badge" class="ml-0.5 px-1.5 py-0.5 text-[11px] font-bold rounded-full bg-amberWarm text-forest">0</span>
            </button>
            <button onclick="toggleMobileMenu()" class="lg:hidden p-2.5 rounded-xl bg-white/15"><i data-lucide="menu" class="w-6 h-6"></i></button>
        </div>
    </div>
    
    <!-- Mobile Menu -->
    <div id="mobile-menu" class="hidden lg:hidden bg-forest text-white border-t border-white/10 mt-3 px-4 pt-3 pb-6 shadow-2xl">
        <div class="flex flex-col space-y-1.5">
            <a href="index.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Home</a>
            <a href="wisata.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Destinasi</a>
            <a href="peta.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Peta</a>
            <a href="trip-planner.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Planner</a>
            <a href="kuliner.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Kuliner</a>
            <a href="artikel.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Artikel</a>
            <a href="kontak.html" class="px-4 py-3 rounded-xl font-medium hover:bg-white/10">Kontak</a>
        </div>
    </div>
</header>

<main class="flex-grow pt-24">
    <!-- Hero Sederhana -->
    <section class="relative bg-forest text-white py-20 px-4 text-center">
        <h1 class="font-heading text-4xl sm:text-6xl font-extrabold mb-6">Jelajahi Pesona <span class="text-amberWarm">Tasikmalaya</span></h1>
        <p class="text-lg text-mintSoft max-w-2xl mx-auto">Dari kemegahan kawah Gunung Galunggung hingga eksotisme Pantai Karang Tawulan.</p>
    </section>

    <!-- Bagian Destinasi Populer -->
    <section class="py-16 bg-creamLight">
        <div class="max-w-7xl mx-auto px-4">
            <h2 class="font-heading text-3xl font-bold text-forest mb-8">Destinasi Populer</h2>
            
            <!-- ID INI YANG DICARI OLEH JAVASCRIPT -->
            <div id="home-popular-grid" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            
        </div>
    </section>
</main>

<!-- Modal & Toast (Wajib ada agar tombol favorit jalan) -->
<div id="favorites-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-forest/70 backdrop-blur-sm p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl max-h-[85vh] flex flex-col">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
            <h3 class="font-heading font-bold text-lg text-forest">Favorit</h3>
            <button onclick="toggleFavoritesModal()" class="p-2 text-slate-500"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <div id="favorites-list-container" class="py-4 overflow-y-auto space-y-3 flex-grow"></div>
    </div>
</div>

<div id="toast-notification" class="fixed bottom-6 right-6 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-forest text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3">
        <i data-lucide="check-circle-2" class="w-5 h-5 text-amberWarm"></i>
        <p id="toast-message" class="text-xs font-medium">OK</p>
    </div>
</div>

<footer class="bg-forest text-white py-8 text-center mt-10">
    <p class="text-mintSoft/80">&copy; 2026 Nuansa Tasikmalaya.</p>
</footer>

<!-- PANGGIL JS DI SINI -->
<script src="js/main.js"></script>
<script>
    // Render kartu ke dalam grid
    document.addEventListener('DOMContentLoaded', () => {
        const grid = document.getElementById('home-popular-grid');
        if (grid) {
            const popular = destinationsData.filter(d => d.popular);
            grid.innerHTML = popular.map(createDestinationCard).join('');
            lucide.createIcons(); // Paksa render ikon
        }
    });
</script>
</body>
</html>
